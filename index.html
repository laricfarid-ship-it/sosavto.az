<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az - Avtomobiliniz üçün hər şey bir arada</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        accentGold: '#f59e0b',
                        accentHover: '#d97706'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="bg-accentGold text-darkBg p-2 rounded-xl font-black text-xl flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <span class="text-2xl font-black tracking-wider text-white">Sos<span class="text-accentGold">Avto</span>.az</span>
            </a>
            <div class="flex items-center space-x-3">
                <a href="xarita.html" class="hidden sm:flex items-center space-x-2 bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl text-sm font-semibold transition">
                    <i class="fa-solid fa-map-location-dot text-accentGold"></i>
                    <span>Servis Xəritəsi</span>
                </a>
                <a href="elan-ver.html" class="flex items-center space-x-2 bg-accentGold hover:bg-accentHover text-darkBg px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg transition transform hover:-translate-y-0.5">
                    <i class="fa-solid fa-plus"></i>
                    <span>Elan Ver</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative py-12 px-4 text-center bg-gradient-to-b from-cardBg to-darkBg border-b border-gray-800">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl sm:text-5xl font-black mb-4 tracking-tight">Avtomobiliniz üçün hər şey bir arada</h1>
            <p class="text-gray-400 text-base sm:text-lg mb-8">Ehtiyat hissələri, GPS servis xəritəsi və avtomobil elanları</p>

            <!-- Main Category Tabs -->
            <div class="flex flex-wrap justify-center gap-2 bg-gray-900/80 p-2 rounded-2xl border border-gray-800 max-w-2xl mx-auto mb-6">
                <button onclick="switchCategory('all')" id="tab-all" class="cat-tab flex-1 min-w-[120px] py-2.5 px-4 rounded-xl font-bold text-sm transition bg-accentGold text-darkBg shadow">Bütün Elanlar</button>
                <button onclick="switchCategory('cars')" id="tab-cars" class="cat-tab flex-1 min-w-[120px] py-2.5 px-4 rounded-xl font-bold text-sm transition text-gray-400 hover:text-white">Avtomobil Satışı</button>
                <button onclick="switchCategory('parts')" id="tab-parts" class="cat-tab flex-1 min-w-[120px] py-2.5 px-4 rounded-xl font-bold text-sm transition text-gray-400 hover:text-white">Ehtiyat Hissələri</button>
                <button onclick="switchCategory('services')" id="tab-services" class="cat-tab flex-1 min-w-[120px] py-2.5 px-4 rounded-xl font-bold text-sm transition text-gray-400 hover:text-white">Servis və Usta</button>
            </div>

            <!-- Advanced Filter Bar -->
            <div class="bg-cardBg p-4 sm:p-6 rounded-2xl border border-gray-800 shadow-xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Marka</label>
                    <select id="filter-brand" onchange="filterListings()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-accentGold">
                        <option value="">Bütün Markalar</option>
                        <option value="Toyota">Toyota</option>
                        <option value="BMW">BMW</option>
                        <option value="Mercedes-Benz">Mercedes-Benz</option>
                        <option value="Hyundai">Hyundai</option>
                        <option value="Kia">Kia</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Şəhər</label>
                    <select id="filter-city" onchange="filterListings()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-accentGold">
                        <option value="">Bütün Şəhərlər</option>
                        <option value="Bakı">Bakı</option>
                        <option value="Sumqayıt">Sumqayıt</option>
                        <option value="Gəncə">Gəncə</option>
                        <option value="Xırdalan">Xırdalan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Qiymət (AZN)</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="filter-min-price" placeholder="Min" oninput="filterListings()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-accentGold">
                        <span class="text-gray-500">-</span>
                        <input type="number" id="filter-max-price" placeholder="Maks" oninput="filterListings()" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-accentGold">
                    </div>
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Sıfırla</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Grid / Listings -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold flex items-center space-x-2">
                <i class="fa-solid fa-list text-accentGold"></i>
                <span>Aktiv Elanlar</span>
            </h2>
            <span id="result-count" class="text-sm text-gray-400 bg-gray-900 px-3 py-1 rounded-full border border-gray-800">0 nəticə tapıldı</span>
        </div>

        <div id="listings-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Listings will load here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-cardBg border-t border-gray-800 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 SosAvto.az - Bütün hüquqlar qorunur.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Sample default listings if localStorage is empty
        const defaultListings = [
            { id: 1, category: 'cars', title: 'Hyundai Elantra Original Porşen', brand: 'Hyundai', city: 'Bakı', price: 150, image: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80', vin: 'KMHD84AE1HU000000' },
            { id: 2, category: 'cars', title: 'BMW X5 M Paket', brand: 'BMW', city: 'Bakı', price: 54000, image: 'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=600&q=80', vin: 'WBA3B1C08EP000000' },
            { id: 3, category: 'cars', title: 'Toyota Camry 2021', brand: 'Toyota', city: 'Sumqayıt', price: 28500, image: 'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?auto=format&fit=crop&w=600&q=80', vin: '1HGCR2F33HA000000' }
        ];

        let currentCategory = 'all';

        function getListings() {
            const stored = localStorage.getItem('sosavto_listings');
            if (!stored) {
                localStorage.setItem('sosavto_listings', JSON.stringify(defaultListings));
                return defaultListings;
            }
            return JSON.parse(stored);
        }

        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.classList.remove('bg-accentGold', 'text-darkBg', 'shadow');
                tab.classList.add('text-gray-400', 'hover:text-white');
            });
            const activeTab = document.getElementById(`tab-${category}`);
            if (activeTab) {
                activeTab.classList.add('bg-accentGold', 'text-darkBg', 'shadow');
                activeTab.classList.remove('text-gray-400', 'hover:text-white');
            }
            filterListings();
        }

        function filterListings() {
            const listings = getListings();
            const brand = document.getElementById('filter-brand').value;
            const city = document.getElementById('filter-city').value;
            const minPrice = parseFloat(document.getElementById('filter-min-price').value) || 0;
            const maxPrice = parseFloat(document.getElementById('filter-max-price').value) || Infinity;

            const filtered = listings.filter(item => {
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                if (brand && item.brand !== brand) return false;
                if (city && item.city !== city) return false;
                if (item.price < minPrice || item.price > maxPrice) return false;
                return true;
            });

            renderListings(filtered);
        }

        function renderListings(items) {
            const container = document.getElementById('listings-container');
            const countLabel = document.getElementById('result-count');
            countLabel.textContent = `${items.length} nəticə tapıldı`;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fa-solid fa-box-open text-4xl mb-3"></i>
                        <p class="text-lg">Heç bir elan tapılmadı.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-cardBg border border-gray-800 rounded-2xl overflow-hidden shadow-lg hover:border-gray-700 transition flex flex-col">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80'}" alt="${item.title}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-darkBg/80 backdrop-blur text-accentGold text-xs font-bold px-3 py-1 rounded-full border border-gray-800 uppercase">${item.category}</span>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-lg mb-2 text-white line-clamp-1">${item.title}</h3>
                            <div class="text-accentGold font-black text-xl mb-3">${item.price} AZN</div>
                            <div class="text-xs text-gray-400 space-y-1">
                                <div><i class="fa-solid fa-location-dot mr-1"></i> Şəhər: ${item.city || 'Bakı'}</div>
                                ${item.vin ? `<div><i class="fa-solid fa-barcode mr-1"></i> VIN: ${item.vin}</div>` : ''}
                            </div>
                        </div>
                        <button class="mt-4 w-full bg-gray-800 hover:bg-gray-700 text-gray-200 py-2 rounded-xl text-sm font-semibold transition">
                            Ətraflı Bax
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function resetFilters() {
            document.getElementById('filter-brand').value = '';
            document.getElementById('filter-city').value = '';
            document.getElementById('filter-min-price').value = '';
            document.getElementById('filter-max-price').value = '';
            filterListings();
        }

        // Initial render on load
        window.onload = () => {
            filterListings();
        };
    </script>
</body>
</html>
