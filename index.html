<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az — Avtomobilinizin bütün ehtiyacı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-zinc-900 to-amber-950 min-h-screen text-slate-100 font-sans">

    <!-- Header -->
    <header class="border-b border-amber-500/20 h-20 flex items-center justify-between px-4 md:px-12 bg-gray-950/70 backdrop-blur sticky top-0 z-50">
        <a href="index.html" class="flex items-center gap-2 text-amber-400 font-bold text-2xl tracking-wider">
            <i class="fa-solid fa-truck-monster"></i>
            <span>SosAvto<span class="text-white">.az</span></span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-300">
            <a href="index.html" class="hover:text-amber-400 transition">Ana Səhifə</a>
            <a href="xarita.html" class="hover:text-amber-400 transition">Servis Xəritəsi</a>
        </nav>
        <a href="elan-ver.html" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Elan Ver
        </a>
    </header>

    <!-- Hero Section -->
    <section class="py-12 px-4 text-center max-w-5xl mx-auto">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
            Avtomobilinizin bütün ehtiyacı — <span class="text-amber-400 drop-shadow-md">bir ünvanda</span>
        </h1>
        <p class="text-slate-300 text-sm md:text-base mb-8 font-medium">
            Ehtiyat hissələri, GPS servis xəritəsi, Çin və digər avtomobillər üçün elanlar
        </p>

        <!-- Kateqoriya Seçim Düymələri -->
        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <button onclick="setCategoryTab('')" id="tab-all" class="category-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-border-all mr-1.5"></i> Bütün Elanlar
            </button>
            <button onclick="setCategoryTab('auto')" id="tab-auto" class="category-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-gray-800/80 text-slate-300 hover:bg-gray-700 border border-gray-700">
                <i class="fa-solid fa-car mr-1.5"></i> Avtomobil Satışı
            </button>
            <button onclick="setCategoryTab('parts')" id="tab-parts" class="category-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-gray-800/80 text-slate-300 hover:bg-gray-700 border border-gray-700">
                <i class="fa-solid fa-gears mr-1.5"></i> Ehtiyat Hissələri
            </button>
            <button onclick="setCategoryTab('service')" id="tab-service" class="category-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-gray-800/80 text-slate-300 hover:bg-gray-700 border border-gray-700">
                <i class="fa-solid fa-wrench mr-1.5"></i> Servis və Usta (Moyka)
            </button>
        </div>

        <!-- Axtarış Paneli -->
        <div class="bg-gray-900/90 border border-amber-500/30 p-4 rounded-2xl shadow-2xl backdrop-blur max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-5 gap-3 items-center">
            <!-- Marka Seçimi -->
            <select id="filterBrand" onchange="onBrandChange()" class="w-full bg-gray-950 border border-gray-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-amber-400 cursor-pointer">
                <option value="">Bütün Markalar</option>
            </select>
            
            <!-- Model Seçimi -->
            <select id="filterModel" onchange="filterAds()" disabled class="w-full bg-gray-950 border border-gray-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-amber-400 cursor-pointer disabled:opacity-50">
                <option value="">Əvvəlcə Marka Seçin</option>
            </select>

            <!-- İl Seçimi -->
            <select id="filterYear" onchange="filterAds()" class="w-full bg-gray-950 border border-gray-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-amber-400 cursor-pointer">
                <option value="">Bütün İllər</option>
            </select>
            
            <!-- Davam Et Düyməsi -->
            <button onclick="handleSearch()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-arrow-right"></i> Davam Et
            </button>

            <!-- Sıfırla Düyməsi -->
            <button onclick="handleReset()" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-slate-300 text-xs font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Sıfırla
            </button>
        </div>
    </section>

    <!-- Elanlar Bölməsi -->
    <main class="max-w-7xl mx-auto px-4 md:px-8 pb-20">
        <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
            <h2 id="sectionTitle" class="text-xl font-bold text-white flex items-center gap-2">
                <span class="w-2.5 h-6 bg-amber-500 rounded-full inline-block shadow-md shadow-amber-500/50"></span> Bütün Elanlar
            </h2>
            <span id="adCounter" class="text-xs text-slate-400 font-semibold"></span>
        </div>

        <!-- Elanlar Grid Konteyneri -->
        <div id="adsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dinamik dolacaq -->
        </div>
    </main>

    <!-- Detal Modalı -->
    <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-amber-500/30 w-full max-w-xl rounded-2xl overflow-hidden shadow-2xl relative flex flex-col max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-950 text-slate-300 hover:text-white w-9 h-9 rounded-full flex items-center justify-center transition z-10 border border-gray-800">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="modalContent" class="overflow-y-auto p-6 space-y-4">
                <!-- Ətraflı məlumatlar -->
            </div>
        </div>
    </div>

    <script>
        const carData = {
            "BYD": ["Song Plus", "Qin Plus", "Han", "Tang", "Destroyer 05", "Yuan Plus", "Seagull", "Chazor"],
            "Changan": ["CS35 Plus", "CS75 Plus", "Uni-K", "Uni-T", "Uni-V", "E-Star", "Alsvin"],
            "Chery": ["Tiggo 2", "Tiggo 4 Pro", "Tiggo 7 Pro", "Tiggo 8 Pro", "Arrizo 5", "Arrizo 8"],
            "Geely": ["Coolray", "Monjaro", "Tugella", "Emgrand", "Okavango"],
            "Haval": ["Jolion", "H6", "Dargo", "M6"],
            "LiXiang (Lixiang)": ["L7", "L8", "L9"],
            "Zeekr": ["001", "009", "X"],
            "Exeed": ["LX", "TXL", "VX", "RX"],
            "GAC": ["Emkoo", "Empow", "GS8"],
            "Jetour": ["T2", "X70 Plus", "Dashing"],
            "BAIC": ["BJ40", "U5 Plus", "X7"],
            "Nio": ["ET5", "ET7", "ES6", "EL7"],
            "Ora": ["Good Cat"],
            "Tank": ["300", "500"],
            "Mercedes-Benz": ["A-Class", "B-Class", "C-Class", "E-Class", "S-Class", "CLA", "CLS", "G-Class", "GLA", "GLC", "GLE", "GLS", "ML-Class", "Vito", "Sprinter"],
            "BMW": ["1-Series", "2-Series", "3-Series", "4-Series", "5-Series", "6-Series", "7-Series", "8-Series", "X1", "X3", "X4", "X5", "X6", "X7", "M3", "M5"],
            "Audi": ["A3", "A4", "A5", "A6", "A7", "A8", "Q3", "Q5", "Q7", "Q8"],
            "Volkswagen": ["Passat", "Golf", "Jetta", "Tiguan", "Touareg", "Polo", "CC", "Arteon"],
            "Porsche": ["Cayenne", "Panamera", "Macan", "911", "Boxster"],
            "Opel": ["Astra", "Vectra", "Zafira", "Insignia", "Corsa"],
            "Toyota": ["Camry", "Corolla", "Land Cruiser", "Prado", "RAV4", "Prius", "Highlander", "Avalon", "Hilux", "Yaris"],
            "Nissan": ["Sunny", "X-Trail", "Qashqai", "Patrol", "Altima", "Teana", "Juke", "Murano", "Navara"],
            "Honda": ["Civic", "Accord", "CR-V", "HR-V", "Fit", "Insight"],
            "Lexus": ["RX", "LX", "GX", "ES", "GS", "IS", "LS"],
            "Mitsubishi": ["Pajero", "Lancer", "Outlander", "ASX"],
            "Subaru": ["Forester", "Outback", "Impreza", "XV"],
            "Hyundai": ["Elantra", "Sonata", "Tucson", "Santa Fe", "Accent", "Creta", "Genesis", "Grandeur", "i30", "Palisade"],
            "Kia": ["Optima", "K5", "Sportage", "Sorento", "Rio", "Cerato", "Ceed", "Stinger", "Carnival"],
            "Chevrolet": ["Cruze", "Malibu", "Aveo", "Cobalt", "Niva", "Tracker", "Captiva", "Orlando", "Lacetti"],
            "Ford": ["Fusion", "Focus", "Fiesta", "Mondeo", "Mustang", "Escape", "Explorer", "Transit"],
            "LADA (VAZ)": ["2106", "2107", "2114", "Niva", "Priora", "Granta", "Vesta", "Kalina", "Largus"]
        };

        let currentCategoryFilter = "";

        document.addEventListener('DOMContentLoaded', function() {
            const brandSelect = document.getElementById('filterBrand');
            Object.keys(carData).sort().forEach(brand => {
                let opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                brandSelect.appendChild(opt);
            });

            const yearSelect = document.getElementById('filterYear');
            const currentYear = new Date().getFullYear();
            for (let y = currentYear; y >= 1990; y--) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            }

            loadAds();
        });

        function onBrandChange() {
            const brandSelect = document.getElementById('filterBrand');
            const modelSelect = document.getElementById('filterModel');
            const selectedBrand = brandSelect.value;

            modelSelect.innerHTML = '';

            if (selectedBrand && carData[selectedBrand]) {
                modelSelect.disabled = false;
                let defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = 'Bütün Modellər';
                modelSelect.appendChild(defaultOpt);

                carData[selectedBrand].forEach(model => {
                    let opt = document.createElement('option');
                    opt.value = model;
                    opt.textContent = model;
                    modelSelect.appendChild(opt);
                });
            } else {
                modelSelect.disabled = true;
                let defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = 'Əvvəlcə Marka Seçin';
                modelSelect.appendChild(defaultOpt);
            }
        }

        function setCategoryTab(category) {
            currentCategoryFilter = category;
            
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.className = "category-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-gray-800/80 text-slate-300 hover:bg-gray-700 border border-gray-700";
            });

            let activeTabId = category === "" ? "tab-all" : `tab-${category}`;
            document.getElementById(activeTabId).className = "category-tab px-5 py-2.5 rounded-xl text-sm font-bold transition bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/30";

            let titleText = "Bütün Elanlar";
            if(category === "auto") titleText = "Avtomobil Elanları";
            if(category === "parts") titleText = "Ehtiyat Hissələri";
            if(category === "service") titleText = "Servis, Usta və Moykalar";
            document.getElementById('sectionTitle').innerHTML = `<span class="w-2.5 h-6 bg-amber-500 rounded-full inline-block shadow-md shadow-amber-500/50"></span> ${titleText}`;

            loadAds();
        }

        function loadAds() {
            const grid = document.getElementById('adsGrid');
            const counter = document.getElementById('adCounter');
            
            const allAds = JSON.parse(localStorage.getItem('sosavto_ads')) || [];
            
            const brandFilter = document.getElementById('filterBrand').value;
            const modelFilter = document.getElementById('filterModel').value;
            const yearFilter = document.getElementById('filterYear').value;

            const ads = allAds.filter(ad => {
                const matchCat = currentCategoryFilter === "" || ad.category === currentCategoryFilter;
                const matchBrand = brandFilter === "" || (ad.autoBrand && ad.autoBrand === brandFilter);
                const matchModel = modelFilter === "" || (ad.autoModel && ad.autoModel === modelFilter);
                const matchYear = yearFilter === "" || (ad.autoYear && String(ad.autoYear) === String(yearFilter));

                return matchCat && matchBrand && matchModel && matchYear;
            });
            
            counter.textContent = `Cəmi ${ads.length} elan tapıldı`;
            grid.innerHTML = '';

            if (ads.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-500">
                        <i class="fa-solid fa-box-open text-4xl mb-3 text-amber-500/50"></i>
                        <p class="text-sm">Axtarışınıza uyğun elan tapılmadı.</p>
                    </div>
                `;
                return;
            }

            [...ads].reverse().forEach(ad => {
                let badgeText = '';
                let badgeClass = '';
                let priceText = ad.autoPrice ? `${ad.autoPrice} AZN` : (ad.partPrice ? `${ad.partPrice} AZN` : (ad.category === 'service' ? 'Xidmət' : 'Razılaşma ilə'));
                let subInfo = ad.autoBrand ? `${ad.autoBrand} ${ad.autoModel || ''} (${ad.autoYear || ''})` : (ad.serviceType || ad.partFitment || ad.address);

                if (ad.category === 'auto') {
                    badgeText = 'Avtomobil';
                    badgeClass = 'bg-red-500/20 text-red-400 border-red-500/30';
                } else if (ad.category === 'service') {
                    badgeText = 'Obyekt / Xidmət';
                    badgeClass = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                } else {
                    badgeText = 'Ehtiyat Hissəsi';
                    badgeClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                }

                const imageHtml = ad.image 
                    ? `<img src="${ad.image}" alt="${ad.title}" class="w-full h-44 object-cover group-hover:scale-105 transition duration-300">`
                    : `<div class="w-full h-44 bg-gray-950 flex items-center justify-center text-gray-700"><i class="fa-solid fa-image text-3xl"></i></div>`;

                const card = document.createElement('div');
                card.className = 'bg-gray-900/90 border border-gray-800 rounded-2xl overflow-hidden shadow-lg hover:border-amber-500/50 transition flex flex-col justify-between cursor-pointer group';
                card.onclick = () => openModal(ad);
                
                card.innerHTML = `
                    <div>
                        <div class="relative overflow-hidden">
                            ${imageHtml}
                            <span class="absolute top-3 left-3 text-[10px] font-bold px-2.5 py-1 rounded-full border backdrop-blur-md ${badgeClass}">
                                ${badgeText}
                            </span>
                        </div>
                        <div class="p-4">
                            <div class="text-lg font-extrabold text-amber-400 mb-1">${priceText}</div>
                            <h3 class="text-sm font-bold text-slate-100 line-clamp-1 mb-1">${ad.title}</h3>
                            <p class="text-xs text-slate-400 mb-3 line-clamp-1"><i class="fa-solid fa-location-dot text-amber-500/80 mr-1"></i>${ad.address || 'Göstərilməyib'}</p>
                            <p class="text-[11px] text-slate-300 bg-gray-950/70 px-2.5 py-1.5 rounded-lg border border-gray-800 inline-block">${subInfo}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <span class="w-full bg-gray-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-xs font-bold py-2.5 rounded-xl transition text-center block">
                            Ətraflı Bax
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            loadAds();
        }

        function handleReset() {
            document.getElementById('filterBrand').value = "";
            const modelSelect = document.getElementById('filterModel');
            modelSelect.value = "";
            modelSelect.disabled = true;
            modelSelect.innerHTML = '<option value="">Əvvəlcə Marka Seçin</option>';
            document.getElementById('filterYear').value = "";
            loadAds();
        }

        function openModal(ad) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            let priceText = ad.autoPrice ? `${ad.autoPrice} AZN` : (ad.partPrice ? `${ad.partPrice} AZN` : 'Razılaşma ilə');
            let imageSection = ad.image ? `<img src="${ad.image}" class="w-full h-64 object-cover rounded-xl mb-4 border border-gray-800">` : '';

            let detailsHtml = '';
            if (ad.category === 'auto') {
                detailsHtml = `
                    <div class="grid grid-cols-2 gap-3 text-xs bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <div><span class="text-slate-400">Marka:</span> <strong class="text-white">${ad.autoBrand || '-'}</strong></div>
                        <div><span class="text-slate-400">Model:</span> <strong class="text-white">${ad.autoModel || '-'}</strong></div>
                        <div><span class="text-slate-400">İl:</span> <strong class="text-white">${ad.autoYear || '-'}</strong></div>
                        <div><span class="text-slate-400">Yürüş:</span> <strong class="text-white">${ad.autoMileage ? ad.autoMileage + ' km' : '-'}</strong></div>
                        <div><span class="text-slate-400">Ötürücü / Korobka:</span> <strong class="text-white">${ad.autoTransmission || '-'}</strong></div>
                    </div>
                `;
            } else if (ad.category === 'service') {
                detailsHtml = `
                    <div class="grid grid-cols-1 gap-2 text-xs bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <div><span class="text-slate-400">Xidmət Növü:</span> <strong class="text-white">${ad.serviceType || '-'}</strong></div>
                        <div><span class="text-slate-400">İş Saatları:</span> <strong class="text-white">${ad.serviceHours || '-'}</strong></div>
                    </div>
                `;
            } else if (ad.category === 'parts') {
                detailsHtml = `
                    <div class="grid grid-cols-2 gap-3 text-xs bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <div><span class="text-slate-400">Vəziyyəti:</span> <strong class="text-white">${ad.partCondition || '-'}</strong></div>
                        <div><span class="text-slate-400">Uyğunluğu:</span> <strong class="text-white">${ad.partFitment || '-'}</strong></div>
                    </div>
                `;
            }

            content.innerHTML = `
                ${imageSection}
                <div class="flex items-center justify-between">
                    <span class="text-2xl font-extrabold text-amber-400">${priceText}</span>
                    <span class="text-xs bg-gray-950 px-3 py-1 rounded-full text-slate-300 border border-gray-800">${ad.category.toUpperCase()}</span>
                </div>
                <h2 class="text-lg font-bold text-white">${ad.title}</h2>
                <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot text-amber-500 mr-1"></i> ${ad.address || 'Ünvan qeyd olunmayıb'}</p>
                
                ${detailsHtml}

                <div class="pt-4 flex gap-3">
                    <a href="tel:${ad.phone}" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition text-center flex items-center justify-center gap-2 shadow-lg shadow-amber-500/25 text-sm">
                        <i class="fa-solid fa-phone"></i> Zəng Et (${ad.phone})
                    </a>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }
    </script>
</body>
</html>
