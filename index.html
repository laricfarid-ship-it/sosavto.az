<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az - Azərbaycanın İlk AI Avtomobil Köməkçisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        accentGold: '#f59e0b',
                        accentHover: '#d97706'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between font-sans">
    
    <!-- Navbar -->
    <header class="bg-cardBg border-b border-gray-800 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="bg-accentGold text-darkBg p-2.5 rounded-xl font-black text-xl flex items-center justify-center shadow-lg shadow-accentGold/20">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <span class="text-2xl font-black tracking-wider text-white">Sos<span class="text-accentGold">Avto</span>.az</span>
            </a>
            
            <div class="flex items-center space-x-3">
                <a href="xarita.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-2">
                    <i class="fa-solid fa-map-location-dot text-accentGold"></i>
                    <span class="hidden md:inline">Servis Xəritəsi</span>
                </a>
                <a href="elan-ver.html" class="bg-accentGold hover:bg-accentHover text-darkBg px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center space-x-1.5 shadow-lg shadow-accentGold/20">
                    <i class="fa-solid fa-plus"></i>
                    <span>Elan Ver</span>
                </a>

                <!-- Dinamik İstifadəçi və ya Giriş -->
                <div id="auth-container">
                    <a href="giris.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-2">
                        <i class="fa-solid fa-user"></i>
                        <span>Giriş</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-12 px-4 text-center relative overflow-hidden">
        <div class="max-w-4xl mx-auto space-y-6">
            <div class="inline-flex items-center space-x-2 bg-accentGold/10 border border-accentGold/30 text-accentGold px-4 py-1.5 rounded-full text-xs font-bold tracking-wide">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Azərbaycanda İlk: AI Avtomobil Köməkçisi</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-black tracking-tight text-white">
                Avtomobiliniz üçün <span class="text-accentGold">hər şey</span> bir arada
            </h1>
            <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto">
                Detail şəklini at, AI sənə dərhal uyğun ustanı, ehtiyat hissəsini və xəritə ünvanını tapsın.
            </p>

            <!-- Axtarış menyusu -->
            <div class="bg-cardBg border border-gray-800 p-4 md:p-6 rounded-3xl shadow-2xl max-w-4xl mx-auto mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-left">
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1">Marka</label>
                    <select class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-accentGold">
                        <option>Bütün Markalar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1">Model</label>
                    <select class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-accentGold">
                        <option>Əvvəl marka seçin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase mb-1">Buraxılış İli</label>
                    <select class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-accentGold">
                        <option>Bütün illər</option>
                    </select>
                </div>
                <div class="flex items-end space-x-2">
                    <button class="w-full bg-accentGold hover:bg-accentHover text-darkBg font-black py-2.5 rounded-xl transition text-sm flex items-center justify-center space-x-1.5 shadow-lg shadow-accentGold/20">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Axtar</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Elanlar siyahısı -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <h2 class="text-xl font-black mb-6 flex items-center space-x-2">
            <i class="fa-solid fa-fire text-accentGold"></i>
            <span>Aktiv Elanlar</span>
        </h2>
        <div id="listings-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Elanlar dinamik yüklənəcək -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-cardBg border-t border-gray-800 py-6 text-center text-xs text-gray-500 mt-12">
        &copy; 2026 SosAvto.az - Bütün hüquqlar qorunur.
    </footer>

    <!-- Auth Script -->
    <script>
        const loggedUser = localStorage.getItem('sosavto_logged_user');
        if (loggedUser) {
            document.getElementById('auth-container').innerHTML = `
                <a href="kabinet.html" class="bg-gray-800 hover:bg-gray-700 text-accentGold px-4 py-2 rounded-xl text-sm font-bold transition flex items-center space-x-2 border border-accentGold/30">
                    <i class="fa-solid fa-user-circle"></i>
                    <span>${loggedUser}</span>
                </a>
            `;
        }

        // Ana səhifədə aktiv elanları göstərmək
        let listings = JSON.parse(localStorage.getItem('sosavto_listings') || '[]');
        let activeListings = listings.filter(ad => ad.status === 'active');
        let grid = document.getElementById('listings-grid');

        if(activeListings.length === 0) {
            grid.innerHTML = `<p class="text-gray-400 text-sm col-span-full">Hal-hazırda aktiv elan yoxdur.</p>`;
        } else {
            grid.innerHTML = activeListings.map(ad => `
                <div class="bg-cardBg border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between">
                    <div>
                        <img src="${ad.image}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="font-bold text-white text-base mb-1">${ad.title}</h3>
                            <p class="text-accentGold font-black text-lg">${ad.price} AZN</p>
                            <p class="text-gray-400 text-xs mt-2"><i class="fa-solid fa-location-dot"></i> ${ad.city || 'Bakı'}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
