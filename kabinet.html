<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesab Məlumatları - SosAvto.az</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#05070b', 
                        cardBg: 'rgba(13, 20, 36, 0.85)', 
                        accentBlue: '#00f2fe', 
                        accentPurple: '#4facfe'
                    } 
                } 
            }
        }
    </script>
    <style>
        .neon-glass {
            background: rgba(13, 20, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="neon-glass border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2.5">
                <div class="bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg p-2.5 rounded-2xl font-black text-xl flex items-center justify-center">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <span class="text-2xl font-black text-white">Sos<span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue to-accentPurple">Avto</span>.az</span>
            </a>
            <a href="index.html" class="text-xs text-accentBlue hover:underline flex items-center space-x-1.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Ana Səhifəyə Qayıt</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full space-y-8">
        <h1 class="text-2xl font-black text-white flex items-center space-x-3">
            <i class="fa-solid fa-id-badge text-accentBlue"></i>
            <span>Hesab Məlumatları və Tənzimləmələr</span>
        </h1>
        
        <!-- Statistika Kartları -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="neon-glass p-5 rounded-2xl border border-gray-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-accentBlue/10 text-accentBlue flex items-center justify-center text-xl">
                    <i class="fa-solid fa-car"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-400">Aktiv Elanlarım</p>
                    <h3 id="stat-listings" class="text-xl font-black text-white">0</h3>
                </div>
            </div>
            <div class="neon-glass p-5 rounded-2xl border border-gray-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-400">Favorilər</p>
                    <h3 id="stat-favorites" class="text-xl font-black text-white">0</h3>
                </div>
            </div>
            <div class="neon-glass p-5 rounded-2xl border border-gray-800 flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl bg-green-500/10 text-green-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-shield-check"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-400">Hesab Statusu</p>
                    <h3 class="text-sm font-bold text-green-400">Təsdiqlənib</h3>
                </div>
            </div>
        </div>

        <!-- Məlumatları Redaktə Formu -->
        <div class="neon-glass p-8 rounded-3xl space-y-6 border border-gray-800 shadow-xl">
            <div class="flex items-center space-x-4 pb-6 border-b border-gray-800">
                <div class="w-16 h-16 rounded-2xl bg-accentBlue/10 border border-accentBlue/30 flex items-center justify-center text-accentBlue text-2xl font-black">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <div>
                    <h2 id="profile-name-title" class="text-xl font-bold text-white">İstifadəçi</h2>
                    <p class="text-xs text-accentBlue">Şəxsi kabinet</p>
                </div>
            </div>

            <form id="profile-form" onsubmit="saveProfile(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-widest">Ad və Soyad</label>
                        <input type="text" id="input-name" required class="w-full bg-[#030508] border border-gray-800 rounded-xl px-4.5 py-3 text-sm text-gray-100 focus:outline-none focus:border-accentBlue">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-widest">Əlaqə Nömrəsi</label>
                        <input type="text" id="input-phone" placeholder="+994 (XX) XXX-XX-XX" class="w-full bg-[#030508] border border-gray-800 rounded-xl px-4.5 py-3 text-sm text-gray-100 focus:outline-none focus:border-accentBlue">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1 uppercase tracking-widest">E-poçt Ünvanı</label>
                    <input type="email" id="input-email" required class="w-full bg-[#030508] border border-gray-800 rounded-xl px-4.5 py-3 text-sm text-gray-100 focus:outline-none focus:border-accentBlue">
                </div>

                <div class="pt-4 flex items-center justify-between flex-wrap gap-4">
                    <button type="submit" class="bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg font-black px-6 py-3 rounded-xl transition text-xs shadow-lg hover:opacity-90 cursor-pointer">
                        <i class="fa-solid fa-floppy-disk mr-1.5"></i> Məlumatları Yenilə
                    </button>
                    <button type="button" onclick="logout()" class="bg-red-500/10 border border-red-500/30 hover:bg-red-500/20 text-red-400 font-bold px-6 py-3 rounded-xl transition text-xs flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Hesabdan Çıxış Et</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="neon-glass border-t border-gray-800 py-6 text-center text-xs text-gray-400">
        &copy; 2026 SosAvto.az - Bütün hüquqlar qorunur.
    </footer>

    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const loggedUser = localStorage.getItem('sosavto_logged_user');

        if (!isLoggedIn && !loggedUser) {
            window.location.href = "giris.html";
        } else {
            // Məlumatları düzgün açarlardan ayrıca oxuyuruq (Ad və Email qarışmır)
            const savedName = localStorage.getItem('sosavto_user_name') || loggedUser || "İstifadəçi";
            const savedPhone = localStorage.getItem('sosavto_user_phone') || "";
            const savedEmail = localStorage.getItem('sosavto_user_email') || "";

            document.getElementById('profile-name-title').innerText = savedName;
            document.getElementById('input-name').value = savedName;
            document.getElementById('input-phone').value = savedPhone;
            document.getElementById('input-email').value = savedEmail;

            // Statistikaları yaz
            const listings = JSON.parse(localStorage.getItem('sosavto_listings') || '[]');
            const favorites = JSON.parse(localStorage.getItem('sosavto_favorites') || '[]');
            document.getElementById('stat-listings').innerText = listings.length;
            document.getElementById('stat-favorites').innerText = favorites.length;
        }

        function saveProfile(e) {
            e.preventDefault();
            const name = document.getElementById('input-name').value;
            const phone = document.getElementById('input-phone').value;
            const email = document.getElementById('input-email').value;

            // Hər məlumatı yalnız öz adına uyğun yadda saxlayırıq
            localStorage.setItem('sosavto_user_name', name);
            localStorage.setItem('sosavto_user_phone', phone);
            localStorage.setItem('sosavto_user_email', email);
            // Qeyd: sosavto_logged_user artıq emaile bərabər edilmir ki, ad dəyişəndə email korlanmasın

            alert('Məlumatlar uğurla yeniləndi!');
            location.reload();
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('sosavto_logged_user');
            localStorage.removeItem('sosavto_user_name');
            localStorage.removeItem('sosavto_user_email');
            localStorage.removeItem('sosavto_user_phone');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
