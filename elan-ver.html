<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elan Yerləşdir - SosAvto.az</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS Xəritə Kitabxanası -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("giris.html");
        }

        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#05070b', 
                        cardBg: 'rgba(13, 20, 36, 0.85)', 
                        accentBlue: '#00f2fe', 
                        accentPurple: '#4facfe'
                    } 
                } 
            }
        }
    </script>
    <style>
        .neon-glass {
            background: rgba(13, 20, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
        }
        .neon-text-glow {
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }
        #map {
            width: 100%;
            height: 280px;
            border-radius: 0.75rem;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between font-sans selection:bg-accentBlue selection:text-darkBg">
    <!-- Navbar -->
    <header class="neon-glass border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2.5 group">
                <div class="bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg p-2.5 rounded-2xl font-black text-xl shadow-lg shadow-accentBlue/30 flex items-center justify-center">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <span class="text-2xl font-black tracking-wider text-white">Sos<span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue to-accentPurple neon-text-glow">Avto</span>.az</span>
            </a>
            <div class="flex items-center space-x-3">
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Çıxış</span>
                </button>
                <a href="index.html" class="bg-gray-900/80 hover:bg-gray-800 text-gray-200 px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2 border border-gray-800">
                    <i class="fa-solid fa-arrow-left text-accentBlue"></i>
                    <span>Ana Səhifə</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-3xl mx-auto px-6 py-10 flex-grow w-full">
        <div class="neon-glass neon-glow p-8 rounded-3xl space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl md:text-3xl font-black text-white">Yeni Elan <span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue to-accentPurple neon-text-glow">Yerləşdirin</span></h1>
                <p class="text-gray-400 text-xs">Dünya bazarının bütün marka və modellərindən seçiminizi edin.</p>
            </div>

            <form onsubmit="submitAd(event)" class="space-y-5">
                <!-- Kateqoriya Seçimi -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Elan Kateqoriyası</label>
                    <select id="categorySelect" onchange="toggleCategoryFields()" class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                        <option value="car">🚗 Avtomobil Satışı</option>
                        <option value="spare">⚙️ Ehtiyat Hissəsi / Aksesuar</option>
                        <option value="service">🔧 Usta / Avtoservis</option>
                        <option value="wash">🧼 Moyka / Detailing</option>
                    </select>
                </div>

                <!-- Ümumi Başlıq -->
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Elan Başlığı</label>
                    <input type="text" id="adTitle" placeholder="Məs: İdeal vəziyyətdə BYD Song Plus və ya Peşəkar Motor Ustası" required class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                </div>

                <!-- 1. AVTOMOBİL SEKTORU (BÜTÜN DÜNYA BAZARI) -->
                <div id="carFields" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Marka</label>
                        <select id="carBrand" onchange="updateModels()" class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option value="">Marka seçin</option>
                            <optgroup label="🇩🇪 Almaniya / Avropa">
                                <option value="Mercedes-Benz">Mercedes-Benz</option>
                                <option value="BMW">BMW</option>
                                <option value="Audi">Audi</option>
                                <option value="Volkswagen">Volkswagen</option>
                                <option value="Porsche">Porsche</option>
                                <option value="Skoda">Skoda</option>
                                <option value="Renault">Renault</option>
                                <option value="Peugeot">Peugeot</option>
                                <option value="Land Rover">Land Rover</option>
                                <option value="Volvo">Volvo</option>
                            </optgroup>
                            <optgroup label="🇨🇳 Çin Bazarı">
                                <option value="BYD">BYD</option>
                                <option value="Changan">Changan</option>
                                <option value="Chery">Chery</option>
                                <option value="Geely">Geely</option>
                                <option value="LiXiang">LiXiang (Lixiang)</option>
                                <option value="Zeekr">Zeekr</option>
                                <option value="Exeed">Exeed</option>
                                <option value="Haval">Haval</option>
                                <option value="Tank">Tank</option>
                                <option value="Nio">Nio</option>
                            </optgroup>
                            <optgroup label="🇰🇷 Koreya Bazarı">
                                <option value="Hyundai">Hyundai</option>
                                <option value="Kia">Kia</option>
                                <option value="Genesis">Genesis</option>
                                <option value="Daewoo">Daewoo</option>
                            </optgroup>
                            <optgroup label="🇯🇵 Yaponiya Bazarı">
                                <option value="Toyota">Toyota</option>
                                <option value="Lexus">Lexus</option>
                                <option value="Nissan">Nissan</option>
                                <option value="Honda">Honda</option>
                                <option value="Subaru">Subaru</option>
                                <option value="Mitsubishi">Mitsubishi</option>
                                <option value="Mazda">Mazda</option>
                                <option value="Infiniti">Infiniti</option>
                            </optgroup>
                            <optgroup label="🇺🇸 Amerika & Digər">
                                <option value="Chevrolet">Chevrolet</option>
                                <option value="Ford">Ford</option>
                                <option value="Tesla">Tesla</option>
                                <option value="Jeep">Jeep</option>
                                <option value="Dodge">Dodge</option>
                                <option value="Cadillac">Cadillac</option>
                                <option value="Fiat">Fiat</option>
                                <option value="Lada">Lada (VAZ)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Model</label>
                        <select id="carModel" class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option value="">Əvvəlcə marka seçin</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Buraxılış İli</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>2015</option><option>2010</option><option>2005</option><option>2000 və əvvəl</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Yürüş (km)</label>
                        <input type="number" placeholder="Məs: 45000" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Qiymət (AZN)</label>
                        <input type="number" placeholder="Məs: 35000" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                    </div>
                </div>

                <!-- 2. EHTİYAT HİSSƏSİ SEKTORU -->
                <div id="spareFields" class="grid grid-cols-1 md:grid-cols-3 gap-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Hansı Model Üçündür?</label>
                        <input type="text" placeholder="Məs: BYD Song Plus / Kia K5" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Ehtiyat Hissəsinin Növü</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option value="">Hissə seçin</option>
                            <option>Ön / Arxa Bufer</option>
                            <option>Fara / Stop işığı</option>
                            <option>Əyləc bəndi (Naklatka)</option>
                            <option>Filterlər (Yağ, Hava)</option>
                            <option>Amortizator / Asqı</option>
                            <option>Mühərrik və karobka hissələri</option>
                            <option>Batareya / Elektrik hissələri</option>
                            <option>Aksesuar</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Vəziyyəti</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option>Yeni (Orijinal / Firm)</option>
                            <option>Az işlənmiş (Üstdənçıxma)</option>
                            <option>Köhnə / Bərpa olunan</option>
                        </select>
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Qiymət (AZN)</label>
                        <input type="number" placeholder="Məs: 150" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                    </div>
                </div>

                <!-- 3. USTA / SERVİS SEKTORU -->
                <div id="serviceFields" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">İxtisas Sahəsi</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option value="">Usta sahəsi seçin</option>
                            <option>🔧 Motorist (Mühərrik ustası)</option>
                            <option>⚙️ Xodovik (Asqı sistemləri)</option>
                            <option>⚡ Elektrik / Diaqnostika (Tesla & Çin xüsusi)</option>
                            <option>🎨 Malyar / Rəngsaz</option>
                            <option>🔨 Çilingər / Rixtovka</option>
                            <option>🚗 Ümumi Avtoservis</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">İş Saatları</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option>09:00 - 19:00 (Hər gün)</option>
                            <option>09:00 - 20:00 (Bazar ertəsi - Şənbə)</option>
                            <option>24 Saat (Gecə də işləyir)</option>
                        </select>
                    </div>
                </div>

                <!-- 4. MOYKA SEKTORU -->
                <div id="washFields" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Xidmət Növü</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option value="">Moyka növü seçin</option>
                            <option>🧼 Əl ilə Sadə Moyka</option>
                            <option>✨ Detailing & Ximçistka</option>
                            <option>🛡️ Keramika örtük & Polirovkа</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">İş Saatları</label>
                        <select class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                            <option>08:00 - 22:00 (Hər gün)</option>
                            <option>24 Saat (Gecə moykası)</option>
                        </select>
                    </div>
                </div>

                <!-- Əlaqə və Şəkil -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Əlaqə Nömrəsi</label>
                        <input type="text" placeholder="+994 (XX) XXX-XX-XX" required class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Şəkillər Əlavə Et</label>
                        <input type="file" multiple accept="image/*" class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-gray-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-accentBlue file:text-darkBg hover:file:opacity-90 transition">
                    </div>
                </div>

                <!-- İNTERAKTİV XƏRİTƏ VƏ ÜNVAN SEÇİMİ -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-semibold text-gray-300">Xəritədə Yerləşdiyiniz Nöqtəni Seçin (Üzərinə toxunun)</label>
                        <button type="button" onclick="locateUser()" class="text-accentBlue text-[11px] hover:underline flex items-center space-x-1 cursor-pointer">
                            <i class="fa-solid fa-crosshairs"></i>
                            <span>Məni Tap (GPS)</span>
                        </button>
                    </div>
                    
                    <!-- Canlı Xəritə Qutusu -->
                    <div id="map"></div>

                    <!-- Avtomatik Doldurulan Ünvan Xanası -->
                    <div>
                        <input type="text" id="selectedAddress" placeholder="Xəritədən nöqtə seçin və ya küçə adı avtomatik yazılacaq..." readonly class="w-full bg-gray-900/90 border border-gray-800 rounded-xl px-4 py-3 text-xs text-accentBlue focus:outline-none font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Ətraflı Məlumat / Qeydlər</label>
                    <textarea rows="3" placeholder="Məhsulun və ya xidmətin xüsusiyyətləri barədə əlavə qeydlər yazın..." class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg font-bold py-3.5 rounded-xl shadow-lg shadow-accentBlue/20 hover:opacity-90 transition cursor-pointer">
                    Elanı Təsdiqə Göndər
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="neon-glass border-t border-gray-800 py-6 text-center text-xs text-gray-400 mt-16">
        &copy; 2026 SosAvto.az - Bütün hüquqlar qorunur.
    </footer>

    <!-- Leaflet JS Xəritə Skripti -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Markalara uyğun zəngin model bazası
        const modelsData = {
            "Mercedes-Benz": ["C-Class", "E-Class", "S-Class", "GLE", "GLS", "G-Class", "A-Class", "CLA", "ML-Class", "W210", "W211", "W212", "W140"],
            "BMW": ["3 Series (E46, F30, G20)", "5 Series (E39, E60, F10, G30)", "7 Series", "X3", "X5", "X6", "M3", "M5"],
            "Audi": ["A4", "A6", "A8", "Q5", "Q7", "Q8", "RS6"],
            "Volkswagen": ["Golf", "Passat", "Tiguan", "Jetta", "Touareg", "Polo"],
            "Porsche": ["Cayenne", "Macan", "Panamera", "Taycan"],
            "Skoda": ["Octavia", "Superb", "Kodiaq", "Rapid"],
            "Renault": ["Megane", "Duster", "Logan", "Symbol"],
            "Peugeot": ["3008", "5008", "2008", "308", "408"],
            "Land Rover": ["Range Rover", "Range Rover Sport", "Defender", "Discovery"],
            "Volvo": ["XC60", "XC90", "S60", "S90"],
            
            "BYD": ["Song Plus", "Han", "Seal", "Qin Plus", "Atto 3", "Destroyer 05"],
            "Changan": ["CS35 Plus", "CS55 Plus", "CS75 Plus", "Uni-K", "Uni-T"],
            "Chery": ["Tiggo 2", "Tiggo 4 Pro", "Tiggo 7 Pro", "Tiggo 8 Pro", "Arrizo 8"],
            "Geely": ["Coolray", "Monjaro", "Atlas Pro", "Tugella"],
            "LiXiang": ["L7", "L8", "L9"],
            "Zeekr": ["001", "X", "009"],
            "Exeed": ["LX", "TXL", "VX", "RX"],
            "Haval": ["H6", "Jolion", "Dargo"],
            "Tank": ["300", "500"],
            "Nio": ["ET5", "ET7", "ES6", "ES8"],

            "Hyundai": ["Elantra", "Sonata", "Tucson", "Santa Fe", "Accent", "Kona", "Palisade"],
            "Kia": ["Optima / K5", "Sorento", "Sportage", "Cerato", "Rio", "Carnival", "Stinger"],
            "Genesis": ["G70", "G80", "G90", "GV70", "GV80"],
            "Daewoo": ["Nexia", "Matiz", "Gentra"],

            "Toyota": ["Camry", "Corolla", "RAV4", "Land Cruiser", "Prado", "Prius", "Highlander", "Avalon"],
            "Lexus": ["RX 350", "NX 200", "LX 570", "LX 600", "ES 350", "GX 460"],
            "Nissan": ["X-Trail", "Qashqai", "Patrol", "Sentra", "Teana", "Rogue"],
            "Honda": ["Civic", "Accord", "CR-V", "HR-V", "Pilot"],
            "Subaru": ["Forester", "Outback", "Impreza", "XV"],
            "Mitsubishi": ["Pajero", "Outlander", "ASX", "L200"],
            "Mazda": ["Mazda 3", "Mazda 6", "CX-5", "CX-9", "CX-30"],
            "Infiniti": ["FX35", "QX56", "QX80", "Q50"],

            "Chevrolet": ["Cruze", "Malibu", "Equinox", "Traverse", "Niva", "Aveo", "Camaro"],
            "Ford": ["Fusion", "Focus", "Mustang", "Escape", "Explorer", "Transit"],
            "Tesla": ["Model 3", "Model Y", "Model S", "Model X", "Cybertruck"],
            "Jeep": ["Grand Cherokee", "Wrangler", "Compass"],
            "Dodge": ["Challenger", "Charger", "Durango"],
            "Cadillac": ["Escalade", "XT5", "XT6"],
            "Fiat": ["Doblo", "Tipo", "500"],
            "Lada": ["Niva (2121)", "Priora", "Granta", "Vesta"]
        };

        function updateModels() {
            const brandSelect = document.getElementById("carBrand").value;
            const modelSelect = document.getElementById("carModel");
            modelSelect.innerHTML = '<option value="">Model seçin</option>';

            if (modelsData[brandSelect]) {
                modelsData[brandSelect].forEach(model => {
                    const opt = document.createElement("option");
                    opt.value = model;
                    opt.textContent = model;
                    modelSelect.appendChild(opt);
                });
            } else {
                const opt = document.createElement("option");
                opt.value = "Digər";
                opt.textContent = "Digər model";
                modelSelect.appendChild(opt);
            }
        }

        // Xəritə başlanğıcı
        const map = L.map('map').setView([40.4093, 49.8671], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let marker;

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            placeMarker(lat, lng);
        });

        function placeMarker(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map);
            }
            map.setView([lat, lng], 15);
            getAddressFromCoords(lat, lng);
        }

        function getAddressFromCoords(lat, lng) {
            const addressInput = document.getElementById('selectedAddress');
            addressInput.value = "Ünvan təyin edilir...";

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                headers: {
                    'Accept-Language': 'az'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data && data.display_name) {
                    addressInput.value = data.display_name;
                } else {
                    addressInput.value = `Seçilən nöqtə: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }
            })
            .catch(() => {
                addressInput.value = `Koordinat: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            });
        }

        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    placeMarker(lat, lng);
                }, () => {
                    alert("Cari yeriniz təyin edilə bildi. Zəhmət olmasa xəritədən özünüz toxunaraq seçin.");
                });
            } else {
                alert("Brauzeriniz GPS xidmətini dəstəkləmir.");
            }
        }

        function toggleCategoryFields() {
            const category = document.getElementById("categorySelect").value;
            document.getElementById("carFields").classList.add("hidden");
            document.getElementById("spareFields").classList.add("hidden");
            document.getElementById("serviceFields").classList.add("hidden");
            document.getElementById("washFields").classList.add("hidden");

            if (category === "car") {
                document.getElementById("carFields").classList.remove("hidden");
            } else if (category === "spare") {
                document.getElementById("spareFields").classList.remove("hidden");
            } else if (category === "service") {
                document.getElementById("serviceFields").classList.remove("hidden");
            } else if (category === "wash") {
                document.getElementById("washFields").classList.remove("hidden");
            }
        }

        function submitAd(event) {
            event.preventDefault();
            const address = document.getElementById("selectedAddress").value;
            if (!address || address.includes("təyin edilir") || address.includes("Xəritədən")) {
                alert("Zəhmət olmasa xəritədən obyektinizin yerini qeyd edin!");
                return;
            }
            alert("Elanınız bütün detallarla birlikdə uğurla qeydə alındı!");
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.removeItem("isLoggedIn");
            window.location.href = "giris.html";
        }
    </script>
</body>
</html>
