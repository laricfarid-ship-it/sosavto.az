<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az — Yeni Elan Ver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brandDark: '#0f172a', brandOrange: '#f59e0b', brandGray: '#94a3b8' } }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-brandDark border-b border-slate-800">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="bg-brandOrange text-brandDark p-2 rounded-lg font-black text-xl"><i class="fa-solid fa-truck-medical"></i> SOS</div>
                <span class="text-xl font-bold tracking-tight">Sos<span class="text-brandOrange">Avto</span>.az</span>
            </a>
            <a href="index.html" class="text-xs text-brandGray hover:text-white">← Ana Səhifəyə Qayıt</a>
        </div>
    </header>

    <div class="py-8 px-4 my-auto">
        <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <h1 class="text-2xl font-bold mb-4">Yeni Elan Yarat</h1>
            <form class="space-y-4">
                <div>
                    <label class="block text-xs text-brandGray mb-1">Elanın Başlığı</label>
                    <input type="text" placeholder="Məs: BMW F30 Amortizator" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-brandGray mb-1">Qiymət (AZN)</label>
                        <input type="number" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-brandGray mb-1">Vəziyyəti</label>
                        <select class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white"><option>Yeni</option><option>İşlənmiş</option></select>
                    </div>
                </div>
                <button type="button" onclick="alert('Elan göndərildi! Admin təsdiqi gözlənilir.')" class="w-full bg-brandOrange text-brandDark font-bold py-3 rounded-xl">Elanı Dərc Et</button>
            </form>
        </div>
    </div>

    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-brandGray">
        © 2026 SosAvto.az — Bütün hüquqlar qorunur.
    </footer>

</body>
</html>
