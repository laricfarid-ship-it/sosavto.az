<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az — Elan Yerləşdir</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #picker-map { height: 260px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 h-20 flex items-center justify-between px-4 md:px-8 shadow-sm">
        <a href="index.html" class="flex items-center gap-2 text-red-600 font-bold text-2xl tracking-wider">
            <i class="fa-solid fa-truck-monster"></i>
            <span>SosAvto<span class="text-slate-800">.az</span></span>
        </a>
        <a href="xarita.html" class="text-sm font-semibold text-slate-600 hover:text-red-600 transition flex items-center gap-2">
            <i class="fa-solid fa-map-location-dot"></i> Xəritəyə Qayıt
        </a>
    </header>

    <!-- Form Container -->
    <main class="max-w-3xl mx-auto my-8 px-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Yeni Xidmət / Elan Əlavə Et</h1>
            <p class="text-slate-500 text-sm mb-6">Məlumatları doldurun və xəritədə dəqiq yerinizi qeyd edin.</p>

            <form id="adForm" class="space-y-5">
                <!-- Başlıq -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Elanın Başlığı</label>
                    <input type="text" id="title" required placeholder="Məs: 7/24 Təcili Evakuator Xidməti" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
                </div>

                <!-- Kateqoriya & Telefon -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Kateqoriya</label>
                        <select id="category" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-sm bg-white">
                            <option value="evakuator">Evakuator</option>
                            <option value="servis">Avto Servis / Usta</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Əlaqə Nömrəsi</label>
                        <input type="tel" id="phone" required placeholder="+994 50 000 00 00" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
                    </div>
                </div>

                <!-- Ünvan -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Ünvan / Məkan Təsviri</label>
                    <input type="text" id="address" required placeholder="Məs: Nərimanov r., Təbriz küçəsi" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
                </div>

                <!-- Xəritədən Nöqtə Seçimi -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Xəritədə Yerinizi Qeyd Edin (Klikləyin)</label>
                    <div id="picker-map" class="mb-2 border border-slate-300"></div>
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-500">
                        <input type="text" id="lat" readonly required placeholder="Enlem (Lat)" class="bg-slate-50 border px-3 py-2 rounded-lg text-slate-600">
                        <input type="text" id="lng" readonly required placeholder="Boylam (Lng)" class="bg-slate-50 border px-3 py-2 rounded-lg text-slate-600">
                    </div>
                </div>

                <!-- Düymə -->
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-600/20 text-sm">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Elanı Dərc Et və Xəritəyə Əlavə Et
                </button>
            </form>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const pickerMap = L.map('picker-map').setView([40.409261, 49.867092], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(pickerMap);

        let selectedMarker;

        pickerMap.on('click', function(e) {
            const { lat, lng } = e.latlng;

            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);

            if (selectedMarker) {
                selectedMarker.setLatLng(e.latlng);
            } else {
                selectedMarker = L.marker(e.latlng).addTo(pickerMap);
            }
        });

        // Form Göndərildikdə Məlumatı LocalStorage-ə yazmaq
        document.getElementById('adForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newAd = {
                id: Date.now(),
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value)
            };

            // Yaddaşdakı köhnə elanları almaq
            const existingAds = JSON.parse(localStorage.getItem('sosavto_ads')) || [];
            existingAds.push(newAd);

            // Yenilənmiş siyahını yaddaşa yazmaq
            localStorage.setItem('sosavto_ads', JSON.stringify(existingAds));

            alert('Elanınız uğurla əlavə olundu və xəritədə yerləşdirildi!');
            window.location.href = 'xarita.html';
        });
    </script>
</body>
</html>
