<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Elan Yerləşdir - SosAvto.az</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        accentGold: '#f59e0b',
                        accentHover: '#d97706'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-cardBg border-b border-gray-800 h-20 flex items-center justify-between px-4 sm:px-6 relative z-20">
        <a href="index.html" class="flex items-center space-x-2">
            <div class="bg-accentGold text-darkBg p-2 rounded-xl font-black text-xl flex items-center justify-center shadow-md">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <span class="text-xl sm:text-2xl font-black tracking-wider text-white">Sos<span class="text-accentGold">Avto</span>.az</span>
        </a>

        <div class="flex items-center space-x-2">
            <a href="xarita.html" class="flex items-center space-x-2 bg-accentGold hover:bg-accentHover text-darkBg px-4 py-2 rounded-xl font-bold text-xs sm:text-sm shadow transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Xəritəyə Qayıt</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="bg-cardBg border border-gray-800 rounded-2xl p-6 sm:p-8 w-full max-w-2xl shadow-xl">
            <h1 class="text-2xl font-black text-white mb-2">Yeni Elan Yerləşdir</h1>
            <p class="text-gray-400 text-sm mb-6">Məlumatları tam və dəqiq doldurun.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">1. Elanın Növünü Seçin</label>
                    <select class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accentGold transition">
                        <option value="">-- Kateqoriya Seçin --</option>
                        <option value="avtomobil">Avtomobil Satışı</option>
                        <option value="ehtiyat">Ehtiyat Hissələri</option>
                        <option value="servis">Servis və Usta</option>
                        <option value="evakuator">Evakuator Xidməti</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
