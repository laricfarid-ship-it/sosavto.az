<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mənim Elanlarım - SosAvto.az</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#05070b', 
                        cardBg: 'rgba(13, 20, 36, 0.85)', 
                        accentBlue: '#00f2fe', 
                        accentPurple: '#4facfe'
                    } 
                } 
            }
        }
    </script>
    <style>
        .neon-glass {
            background: rgba(13, 20, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="neon-glass border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2.5">
                <div class="bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg p-2.5 rounded-2xl font-black text-xl flex items-center justify-center">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <span class="text-2xl font-black text-white">Sos<span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue to-accentPurple">Avto</span>.az</span>
            </a>
            <a href="index.html" class="text-xs text-accentBlue hover:underline flex items-center space-x-1.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Ana Səhifəyə Qayıt</span>
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full space-y-6">
        <h1 class="text-2xl font-black text-white flex items-center space-x-3">
            <i class="fa-solid fa-car text-accentBlue"></i>
            <span>Mənim Elanlarım</span>
        </h1>
        <div id="my-listings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dinamik doldurulacaq -->
        </div>
    </main>

    <footer class="neon-glass border-t border-gray-800 py-6 text-center text-xs text-gray-400">
        &copy; 2026 SosAvto.az - Bütün hüquqlar qorunur.
    </footer>

    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        if (!isLoggedIn) {
            window.location.href = "giris.html";
        }

        const allListings = JSON.parse(localStorage.getItem('sosavto_listings') || '[]');
        const loggedUser = localStorage.getItem('sosavto_logged_user') || 'İstifadəçi';
        
        // Burada istifadəçinin öz elanları süzülür (əgər elanlarda yiyə məlumatı varsa)
        let grid = document.getElementById('my-listings-grid');
        
        // Hələlik nümunə olaraq bütün aktiv elanları və ya boş vəziyyəti göstəririk
        if (allListings.length === 0) {
            grid.innerHTML = `<p class="text-gray-400 text-sm col-span-full py-12 text-center neon-glass rounded-2xl">Heç bir elanınız yoxdur.</p>`;
        } else {
            grid.innerHTML = allListings.map(ad => `
                <div class="neon-glass border border-gray-800 rounded-2xl overflow-hidden shadow-xl p-4 space-y-3">
                    <img src="${ad.image || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=600&q=80'}" class="w-full h-40 object-cover rounded-xl">
                    <h3 class="font-bold text-white text-base">${ad.title}</h3>
                    <p class="text-accentBlue font-black text-base">${ad.price} AZN</p>
                    <span class="inline-block bg-accentBlue/10 text-accentBlue text-xs px-2.5 py-1 rounded-lg border border-accentBlue/20">Aktiv</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
