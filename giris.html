<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - SosAvto.az</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#05070b', 
                        cardBg: 'rgba(13, 20, 36, 0.85)', 
                        accentBlue: '#00f2fe', 
                        accentPurple: '#4facfe',
                        accentHover: '#38bdf8'
                    } 
                } 
            }
        }
    </script>
    <style>
        .neon-glass {
            background: rgba(13, 20, 36, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
        }
        .neon-text-glow {
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between font-sans selection:bg-accentBlue selection:text-darkBg">
    <!-- Navbar -->
    <header class="neon-glass border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2.5 group">
                <div class="bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg p-2.5 rounded-2xl font-black text-xl shadow-lg shadow-accentBlue/30 flex items-center justify-center">
                    <i class="fa-solid fa-car-side"></i>
                </div>
                <span class="text-2xl font-black tracking-wider text-white">Sos<span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue to-accentPurple neon-text-glow">Avto</span>.az</span>
            </a>
            <a href="index.html" class="bg-gray-900/80 hover:bg-gray-800 text-gray-200 px-4.5 py-2.5 rounded-xl text-sm font-semibold transition flex items-center space-x-2 border border-gray-800">
                <i class="fa-solid fa-arrow-left text-accentBlue"></i>
                <span>Ana Səhifə</span>
            </a>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-md mx-auto px-6 py-16 flex-grow w-full flex items-center">
        <div class="neon-glass neon-glow p-8 rounded-3xl space-y-6 w-full">
            <div class="text-center space-y-2">
                <div class="inline-flex bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg p-3 rounded-2xl text-xl shadow-lg shadow-accentBlue/30 mb-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <h1 class="text-2xl font-black text-white">Hesaba <span class="text-transparent bg-clip-text bg-gradient-to-r from-accentBlue to-accentPurple neon-text-glow">Giriş</span></h1>
                <p class="text-gray-400 text-xs">Elanlarınızı idarə etmək üçün daxil olun.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">İstifadəçi Adı</label>
                    <input type="text" id="username" placeholder="İstifadəçi adınızı daxil edin" required class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Şifrə</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-100 focus:border-accentBlue focus:outline-none transition">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-accentBlue to-accentPurple text-darkBg font-bold py-3.5 rounded-xl shadow-lg shadow-accentBlue/20 hover:opacity-90 transition cursor-pointer">
                    Daxil ol
                </button>
            </form>

            <div class="text-center text-xs text-gray-400 pt-2 border-t border-gray-800/60">
                Hesabınız yoxdur? <a href="qeydiyyat.html" class="text-accentBlue font-semibold hover:underline">Qeydiyyatdan keç</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="neon-glass border-t border-gray-800 py-6 text-center text-xs text-gray-400 mt-16">
        &copy; 2026 SosAvto.az - Bütün hüquqlar qorunur.
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById("username").value;
            
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("sosavto_logged_user", username);
            localStorage.setItem("sosavto_user_name", username);
            
            const redirectUrl = localStorage.getItem("redirectAfterLogin") || "index.html";
            localStorage.removeItem("redirectAfterLogin");
            
            window.location.href = redirectUrl;
        }
    </script>
</body>
</html>
