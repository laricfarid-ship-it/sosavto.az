name: Android test APK
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug bundleRelease assembleDebugAndroidTest --no-daemon
      - name: Android 16 device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash mobile/scripts/device-smoke.sh
      - name: Upload private test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SosAvto-Android-beta
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB candidate and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SosAvto-Android-audit-and-unsigned-AAB
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/device-audit/
          retention-days: 30
