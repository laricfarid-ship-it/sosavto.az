name: Admin 2FA branch checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'server/**'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-2fa-checks.yml'
  push:
    branches: [feat/admin-2fa]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: env -u VERCEL -u DATABASE_URL -u GEMINI_API_KEY -u OPENAI_API_KEY -u OPENAI_MODEL -u AI_PROVIDER -u AI_ENABLED LOCAL_DATABASE=true LOCAL_DB_PATH=memory:// APP_ORIGIN=http://localhost:4173 npm test
      - run: npm run build
