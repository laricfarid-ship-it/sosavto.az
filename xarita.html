<script>
        function focusService(lat, lng, name) {
            let iframe = document.getElementById('map-iframe');
            iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        }

        function locateUser() {
            // Əvvəlcə brauzerin öz GPS xidmətini yoxlayırıq
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;
                    updateMap(lat, lng);
                }, function(error) {
                    // Əgər Windows/brauzer konum verə bilməsə, IP vasitəsilə avtomatik tapırıq
                    fallbackToIP();
                }, { timeout: 5000 });
            } else {
                fallbackToIP();
            }
        }

        function fallbackToIP() {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    if (data.latitude && data.longitude) {
                        updateMap(data.latitude, data.longitude);
                    } else {
                        alert("Konum avtomatik təyin edilə bilmədi.");
                    }
                })
                .catch(() => {
                    alert("Konum təyin edilərkən xəta baş verdi.");
                });
        }

        function updateMap(lat, lng) {
            let iframe = document.getElementById('map-iframe');
            iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
        }
    </script>
