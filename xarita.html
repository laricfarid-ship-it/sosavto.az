<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az — GPS Servis Xəritəsi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Fontlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: calc(100vh - 80px); width: 100%; z-index: 1; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen">

    <!-- Naviqasiya Paneli -->
    <header class="bg-white border-b border-slate-200 h-20 flex items-center justify-between px-4 md:px-8 z-10 shadow-sm">
        <a href="index.html" class="flex items-center gap-2 text-red-600 font-bold text-2xl tracking-wider">
            <i class="fa-solid fa-truck-monster"></i>
            <span>SosAvto<span class="text-slate-800">.az</span></span>
        </a>

        <!-- Xəritə Filtrləri -->
        <div class="flex gap-2 overflow-x-auto py-1">
            <button onclick="filterMarkers('all')" class="px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg hover:bg-slate-700 transition">Bütün Nöqtələr</button>
            <button onclick="filterMarkers('evakuator')" class="px-4 py-2 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition"><i class="fa-solid fa-truck-pickup mr-1"></i> Evakuator</button>
            <button onclick="filterMarkers('servis')" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition"><i class="fa-solid fa-wrench mr-1"></i> Servis</button>
        </div>

        <a href="elan-ver.html" class="hidden md:inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition">
            <i class="fa-solid fa-plus"></i> Elan Yerləşdir
        </a>
    </header>

    <!-- Xəritə Konteyneri -->
    <div class="relative flex-1">
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Xəritəni Bakı koordinatları ilə başlatmaq
        const map = L.map('map').setView([40.409261, 49.867092], 12);

        // OpenStreetMap qatını əlavə etmək
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Nümunə Məlumatlar
        const locations = [
            { id: 1, title: "7/24 Təcili Evakuator", category: "evakuator", lat: 40.409261, lng: 49.867092, phone: "+994 50 123 45 67", address: "28 May küç." },
            { id: 2, title: "Avto Elektrik və Diaqnostika", category: "servis", lat: 40.380000, lng: 49.820000, phone: "+994 55 987 65 43", address: "Yasamal r., Şərifzadə küç." },
            { id: 3, title: "Ekspres Evakuator Xidməti", category: "evakuator", lat: 40.420000, lng: 49.910000, phone: "+994 70 555 44 33", address: "Nərimanov r." },
            { id: 4, title: "Mühərrik və Şassi Servisi", category: "servis", lat: 40.360000, lng: 49.840000, phone: "+994 50 333 22 11", address: "Səbail r., Badamdar" }
        ];

        let markerList = [];

        // Markerləri Xəritəyə Əlavə Edən Funksiya
        function renderMarkers(data) {
            markerList.forEach(m => map.removeLayer(m));
            markerList = [];

            data.forEach(item => {
                const marker = L.marker([item.lat, item.lng]).addTo(map);
                
                // Google Maps & Waze Linkləri
                const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
                const wazeUrl = `https://waze.com/ul?ll=${item.lat},${item.lng}&navigate=yes`;

                const popupContent = `
                    <div class="p-1 min-w-[200px]">
                        <span class="text-xs font-bold uppercase tracking-wider ${item.category === 'evakuator' ? 'text-red-600' : 'text-blue-600'}">${item.category}</span>
                        <h3 class="font-bold text-slate-800 text-base mt-0.5">${item.title}</h3>
                        <p class="text-slate-500 text-xs mt-1 mb-2"><i class="fa-solid fa-location-dot"></i> ${item.address}</p>
                        
                        <!-- Naviqasiya Düymələri -->
                        <div class="grid grid-cols-2 gap-1.5 my-2">
                            <a href="${gmapsUrl}" target="_blank" class="flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold py-1.5 px-2 rounded-lg border border-slate-200 transition text-decoration-none">
                                <i class="fa-brands fa-google text-blue-600"></i> Google Maps
                            </a>
                            <a href="${wazeUrl}" target="_blank" class="flex items-center justify-center gap-1.5 bg-sky-50 hover:bg-sky-100 text-sky-700 text-[11px] font-semibold py-1.5 px-2 rounded-lg border border-sky-200 transition text-decoration-none">
                                <i class="fa-brands fa-waze text-sky-500"></i> Waze
                            </a>
                        </div>

                        <!-- Zəng Et Düyməsi -->
                        <a href="tel:${item.phone}" class="flex items-center justify-center w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs py-2 px-3 rounded-lg gap-2 transition text-decoration-none">
                            <i class="fa-solid fa-phone"></i> ${item.phone}
                        </a>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markerList.push(marker);
            });
        }

        renderMarkers(locations);

        function filterMarkers(category) {
            if (category === 'all') {
                renderMarkers(locations);
            } else {
                const filtered = locations.filter(loc => loc.category === category);
                renderMarkers(filtered);
            }
        }
    </script>
</body>
</html>
