<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SosAvto.az — GPS Servis Xəritəsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brandDark: '#0f172a', brandOrange: '#f59e0b', brandGray: '#94a3b8' } }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-brandDark border-b border-slate-800">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="bg-brandOrange text-brandDark p-2 rounded-lg font-black text-xl"><i class="fa-solid fa-truck-medical"></i> SOS</div>
                <span class="text-xl font-bold tracking-tight">Sos<span class="text-brandOrange">Avto</span>.az</span>
            </a>
            <a href="index.html" class="text-xs text-brandGray hover:text-white">← Ana Səhifəyə Qayıt</a>
        </div>
    </header>

    <div class="flex flex-col md:flex-row flex-1">
        <div class="w-full md:w-80 bg-slate-900 p-4 border-r border-slate-800">
            <h2 class="font-bold text-lg mb-4"><i class="fa-solid fa-map-location-dot text-brandOrange mr-2"></i> Yaxınlıqdakı Servislər</h2>
            <div class="space-y-3">
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 class="font-bold text-sm">Baku Auto Express</h3>
                    <p class="text-xs text-brandGray">Yağ dəyişmə, Diaqnostika</p>
                    <span class="text-amber-400 text-xs">★ 4.9 • 1.2 km</span>
                </div>
            </div>
        </div>
        <div class="flex-1 bg-slate-900 flex items-center justify-center p-8 text-center min-h-[400px]">
            <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl">
                <i class="fa-solid fa-crosshairs text-brandOrange text-3xl mb-3 animate-pulse"></i>
                <p class="text-sm font-semibold">GPS Mövqeyiniz: Bakı, Yasamal</p>
                <p class="text-xs text-brandGray mt-1">İnteraktiv xəritə inteqrasiyası</p>
            </div>
        </div>
